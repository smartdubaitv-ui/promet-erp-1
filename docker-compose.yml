version: '3.8'

services:
  # خدمة تطبيق الـ Express والـ React (تم بناؤه من الـ Dockerfile)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:8080
      - FIREBASE_PROJECT_ID=gen-lang-client-0494646055
      - JWT_SECRET=hegazy_erp_secret_key_12345
    depends_on:
      - firebase-emulator
    restart: always

  # خدمة محاكي Firebase (Firebase Emulator) لبيئة التطوير المحلية
  firebase-emulator:
    image: andreysenov/firebase-emulator:latest
    ports:
      - "8080:8080" # منفذ محاكي Firestore
      - "4000:4000" # منفذ واجهة مستخدم المحاكي (Emulator UI)
    volumes:
      - ./firebase.json:/home/node/firebase.json
      - ./firestore.rules:/home/node/firestore.rules
    environment:
      - FIREBASE_PROJECT=gen-lang-client-0494646055
    # تشغيل محاكي Firestore فقط بناءً على إعدادات المشروع
    command: firebase emulators:start --only firestore --project gen-lang-client-0494646055
    restart: always
