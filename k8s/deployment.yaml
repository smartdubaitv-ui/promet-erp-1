apiVersion: apps/v1
kind: Deployment
metadata:
  name: promet-core-deployment
  namespace: production
  labels:
    app: promet-core
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: promet-core
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: promet-core
    spec:
      containers:
        - name: promet-app
          image: gcr.io/promet-sa-enterprise/core-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http-web
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: promet-secrets
                  key: jwt-secret
            - name: DB_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: promet-secrets
                  key: db-encryption-key
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: promet-core-service
  namespace: production
spec:
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app: promet-core
  type: ClusterIP
